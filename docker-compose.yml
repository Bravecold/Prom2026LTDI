services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prom2026
      POSTGRES_USER: prom
      POSTGRES_PASSWORD: prom
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prom -d prom2026"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://prom:prom@db:5432/prom2026
      JWT_SECRET: change-this-local-secret
      CORS_ORIGINS: http://localhost:4173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: